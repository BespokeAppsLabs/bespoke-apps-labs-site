<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; background: #050b09; }
    .mb * { box-sizing: border-box; }
    .mb { position: relative; width: 390px; height: 844px; overflow: hidden; background: #050b09; color: #f3f0e7;
          font-family: "Plus Jakarta Sans", "Helvetica Neue", sans-serif; display: flex; flex-direction: column; }
    .mb a { color: var(--ac); text-decoration: none; }
    .mb a:hover { color: #f3f0e7; }
    .mb button { font: inherit; color: inherit; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
    .lab { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: #6a7a72; }
    .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }
    .disp { font-family: "Plus Jakarta Sans", "Helvetica Neue", sans-serif; font-weight: 600; letter-spacing: -.03em; }
    .mk { display: inline-grid; grid-template-columns: 3px 3px 3px; gap: 2px; align-items: end; }
    .mk i { display: block; background: var(--ac); }
    .logo { font-family: "Plus Jakarta Sans", "Helvetica Neue", sans-serif; font-weight: 600; letter-spacing: -.03em; color: #f3f0e7; line-height: 1; white-space: nowrap; display: inline-block; }
    .logo b { color: var(--br); font-weight: 600; font-size: 1em; letter-spacing: .01em; }
    .logo i { font-style: normal; color: var(--br); font-weight: 600; font-size: .94em; padding: 0 .03em; }
    .logo-sub { font-family: "Plus Jakarta Sans", sans-serif; font-weight: 300; letter-spacing: .6em; margin-right: -.6em; text-transform: lowercase; color: #7f8f86; }


    .bg { position: absolute; inset: 0; pointer-events: none;
          background: radial-gradient(110% 46% at 50% 30%, rgba(199,163,90,.09), transparent 64%), linear-gradient(#0a1512, #050b09 58%); }
    .bg:after { content: ""; position: absolute; inset: 0; opacity: .4;
      background-image: linear-gradient(rgba(199,163,90,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(199,163,90,.06) 1px, transparent 1px);
      background-size: 52px 52px; mask-image: radial-gradient(100% 50% at 50% 26%, black, transparent 76%); }

    .top { position: relative; display: flex; align-items: center; justify-content: space-between; height: 46px; padding: 0 16px; border-bottom: 1px solid rgba(199,163,90,.13); }
    .stage { position: relative; height: 250px; flex: none; }
    .core-cv { position: absolute; inset: 0; width: 390px; height: 250px; pointer-events: none; }
    .spin { transform-origin: 195px 100px; animation: rot 200s linear infinite; }
    .pulse { animation: pl 7s ease-in-out infinite; }
    @keyframes rot { to { transform: rotate(360deg); } }
    @keyframes pl { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes up { from { transform: translateY(100%); } to { transform: none; } }
    .node { position: absolute; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
            border: 1px solid rgba(199,163,90,.34); background: rgba(5,11,9,.86); display: grid; place-items: center; }
    .node:active { border-color: var(--lv); }

    .row { display: grid; grid-template-columns: 24px 13px minmax(0,1fr) 13px; gap: 10px; align-items: center; width: 100%;
           min-height: 54px; padding: 7px 16px; border-bottom: 1px solid rgba(199,163,90,.08); }
    .row:last-child { border-bottom: 0; }
    .row:active { background: rgba(199,163,90,.07); }

    .btn { display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--ac); color: #071a15; height: 50px;
           font-family: "JetBrains Mono", monospace; font-size: 10.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; cursor: pointer; }
    .btn:active { background: #f3f0e7; }

    .scrim { position: absolute; inset: 0; background: rgba(3,7,6,.8); backdrop-filter: blur(8px); z-index: 40; }
    .sheet { position: absolute; z-index: 41; left: 0; right: 0; bottom: 0; max-height: 660px; background: #071110;
             border-top: 2px solid var(--ac); box-shadow: 0 -30px 80px rgba(0,0,0,.6); display: flex; flex-direction: column;
             animation: up .34s cubic-bezier(.2,.8,.2,1) both; }
    .mb[data-motion="off"] * { animation: none !important; }
  </style>
</helmet>

<div class="mb" style="--ac: {{accent}}; --lv: {{live}}; --br: {{brand}};" data-motion="{{motionAttr}}">
  <div class="bg"></div>

  <header class="top">
    <span class="logo" style="font-size: 15px;"><b>&lt;</b>Bespoke<i>/</i><b>&gt;</b></span>
    <span class="lab" style="display: flex; align-items: center; gap: 6px;">
      <span class="pulse" style="width: 5px; height: 5px; background: {{live}}; display: inline-block; border-radius: 50%;"></span>
      Console live
    </span>
  </header>

  <div style="position: relative; padding: 16px 16px 10px; text-align: center;">
    <h1 class="disp" style="margin: 0; font-size: 27px; line-height: 1.1;">Bring us the<br><em style="font-style: italic; color: {{accent}};">hard part.</em></h1>
    <p class="lab" style="margin: 11px 0 0; letter-spacing: .22em;">Applications · Operators · Infrastructure</p>
  </div>

  <div class="stage">
    <canvas class="core-cv" id="mb-core" width="390" height="250"></canvas>
    <sc-for list="{{nodes}}" as="n" hint-placeholder-count="6">
      <button type="button" class="node" style="left: {{n.left}}; top: {{n.top}};" onClick="{{ n.open }}" aria-label="{{n.name}}">
        <span class="mk" style="height: 16px;"><i style="height: {{n.b1}}px"></i><i style="height: {{n.b2}}px"></i><i style="height: {{n.b3}}px"></i></span>
      </button>
    </sc-for>
  </div>

  <div style="position: relative; display: flex; align-items: center; gap: 9px; padding: 10px 16px 8px; border-top: 1px solid rgba(199,163,90,.13); border-bottom: 1px solid rgba(199,163,90,.13);">
    <span class="lab">Capability index</span>
    <span class="lab" style="margin-left: auto;">01—06</span>
  </div>

  <div style="position: relative; flex: 1; min-height: 0; overflow: hidden;">
    <sc-for list="{{modules}}" as="m" hint-placeholder-count="6">
      <button type="button" class="row" onClick="{{ m.open }}">
        <span class="mono" style="font-size: 10px; color: #55655c;">{{m.n}}</span>
        <span class="mk" style="height: 13px;"><i style="height: {{m.b1}}px"></i><i style="height: {{m.b2}}px"></i><i style="height: {{m.b3}}px"></i></span>
        <span style="display: grid; gap: 2px; min-width: 0;">
          <span class="disp" style="font-size: 15px; line-height: 1.15;">{{m.name}}</span>
          <span style="font-size: 10px; line-height: 1.35; color: #6f7f76;">{{m.short}}</span>
        </span>
        <span style="color: #43514a; font-size: 12px;">↗</span>
      </button>
    </sc-for>
  </div>

  <button type="button" class="btn" style="position: relative; flex: none;" onClick="{{ openContact }}">Start a build <span style="font-size: 13px;">↘</span></button>

  <sc-if value="{{dialogOpen}}" hint-placeholder-val="{{true}}">
    <div class="scrim" onClick="{{ close }}"></div>
    <div class="sheet">
      <div style="display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; border-bottom: 1px solid rgba(199,163,90,.16);">
        <span class="mono" style="font-size: 9.5px; letter-spacing: .18em; color: {{accent}};">{{dlg.kicker}}</span>
        <button type="button" class="lab" style="margin-left: auto; letter-spacing: .18em;" onClick="{{ close }}">Close ✕</button>
      </div>
      <div style="padding: 18px 16px 20px; overflow-y: auto;">
        <h2 class="disp" style="margin: 0; font-size: 22px; line-height: 1.15;">{{dlg.title}}</h2>
        <p style="margin: 12px 0 0; font-size: 13px; line-height: 1.65; color: #a4b3aa;">{{dlg.body}}</p>
        <div class="lab" style="margin-top: 20px; padding-bottom: 9px; border-bottom: 1px solid rgba(199,163,90,.16);">{{dlg.aLabel}}</div>
        <sc-for list="{{dlg.items}}" as="it" hint-placeholder-count="4">
          <div style="display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(199,163,90,.07); font-size: 12.5px; color: #b8c5bc;">
            <span style="color: {{live}}; font-size: 9px; line-height: 1.7;">◆</span>{{it.t}}
          </div>
        </sc-for>
        <button type="button" class="btn" style="width: 100%; margin-top: 20px;" onClick="{{ openContact }}">{{dlg.cta}} <span style="font-size: 13px;">↗</span></button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#c7a35a","options":["#c7a35a","#f97316","#34d399","#a78bfa"],"section":"Palette"},"live":{"editor":"color","default":"#34d399","options":["#34d399","#4ecdc4","#f59e0b"],"section":"Palette"},"brand":{"editor":"color","default":"#00B87E","options":["#00B87E","#008F64","#34d399"],"section":"Palette"},"motion":{"editor":"boolean","default":true,"section":"Palette"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: null };
  }

  componentDidMount() {
    this._t0 = Date.now();
    this.boot(0);
  }

  componentWillUnmount() {
    this._dead = true;
    if (this._raf) cancelAnimationFrame(this._raf);
  }

  boot(n) {
    if (this._dead) return;
    const cv = document.getElementById("mb-core");
    if (!cv) {
      if (n > 180) return;
      this._raf = requestAnimationFrame(() => this.boot(n + 1));
      return;
    }
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = 390 * dpr; cv.height = 250 * dpr;
    this._ctx = cv.getContext("2d");
    this._ctx.scale(dpr, dpr);
    this._pts = this.buildField();
    this.frame();
  }

  ANG() { return [210, 180, 150, 330, 0, 30]; }

  nodeXY(i) {
    const a = this.ANG()[i] * Math.PI / 180;
    return [Math.cos(a) * 118, Math.sin(a) * 118];
  }

  buildField() {
    const out = [], GA = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < 190; i++) {
      const y = 1 - (i / 189) * 2, r = Math.sqrt(Math.max(0, 1 - y * y)), th = i * GA, j = 0.97 + this.rand() * 0.06;
      out.push({ x: Math.cos(th) * r * j, y: y * j, z: Math.sin(th) * r * j,
                 s: 0.4 + this.rand() * 0.5, a: 0.3 + this.rand() * 0.32,
                 c: this.rand() > 0.82 ? 2 : 0, ph: this.rand() * 6.28, sp: 0.4 + this.rand() * 0.5 });
    }
    for (let i = 0; i < 130; i++) {
      const u = this.rand() * 2 - 1, th = this.rand() * Math.PI * 2, r = Math.pow(this.rand(), 0.55) * 0.7, w = Math.sqrt(Math.max(0, 1 - u * u));
      out.push({ x: Math.cos(th) * w * r, y: u * r, z: Math.sin(th) * w * r,
                 s: 0.45 + this.rand() * 0.8, a: 0.34 + this.rand() * 0.48,
                 c: this.rand() > 0.72 ? 1 : (this.rand() > 0.5 ? 2 : 0), ph: this.rand() * 6.28, sp: 0.7 + this.rand() * 1.3 });
    }
    return out;
  }

  rgb(hex) {
    const h = (hex || "").replace("#", "");
    if (h.length !== 6) return [199, 163, 90];
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }

  frame() {
    if (this._dead || !this._ctx) return;
    const live = (this.props.motion ?? true), held = !!this.state.open;
    if (live && !held) this._spin = (this._spin || 0) + 0.0021;

    const t = (Date.now() - this._t0) / 1000, ctx = this._ctx;
    const C = 195, CY = 125, R = 86 * (live && !held ? 1 + Math.sin(t * 0.55) * 0.035 : 1);
    const AC = this.rgb(this.props.accent ?? "#c7a35a"), LV = this.rgb(this.props.live ?? "#34d399");
    const cols = [AC, LV, [243, 240, 231]];
    const ai = this.data().map((m) => m.id).indexOf(this.state.open);

    ctx.clearRect(0, 0, 390, 250);
    ctx.globalCompositeOperation = "lighter";
    const g = ctx.createRadialGradient(C, CY, 0, C, CY, 116);
    g.addColorStop(0, "rgba(" + LV[0] + "," + LV[1] + "," + LV[2] + ",.10)");
    g.addColorStop(0.34, "rgba(" + AC[0] + "," + AC[1] + "," + AC[2] + ",.055)");
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 390, 250);

    const D = Math.PI / 180, arcs = [[138 * D, 222 * D], [-42 * D, 42 * D]];
    for (let k = 0; k < 2; k++) {
      ctx.strokeStyle = "rgba(" + AC[0] + "," + AC[1] + "," + AC[2] + ",.22)";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(C, CY, 118, arcs[k][0], arcs[k][1]); ctx.stroke();
      ctx.setLineDash([2, 20]);
      ctx.lineDashOffset = live && !held ? -(t * 8) % 22 : 0;
      ctx.strokeStyle = "rgba(" + LV[0] + "," + LV[1] + "," + LV[2] + ",.2)";
      ctx.beginPath(); ctx.arc(C, CY, 118, arcs[k][0], arcs[k][1]); ctx.stroke();
      ctx.setLineDash([]);
    }

    const yaw = this._spin || 0, pitch = Math.sin(t * 0.14) * 0.16;
    const cy = Math.cos(yaw), sy = Math.sin(yaw), cx = Math.cos(pitch), sx = Math.sin(pitch);
    const pts = this._pts, dim = ai >= 0 ? 0.78 : 1;
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      const puff = 1 + Math.sin(t * p.sp + p.ph) * 0.045;
      const px = p.x * puff, py = p.y * puff, pz = p.z * puff;
      const x1 = px * cy - pz * sy, z1 = px * sy + pz * cy;
      const y1 = py * cx - z1 * sx, z2 = py * sx + z1 * cx;
      const d = 2.9 / (2.9 + z2), c = cols[p.c];
      const al = p.a * dim * (0.22 + 0.78 * (d - 0.62) / 0.55);
      if (al > 0.01) {
        ctx.fillStyle = "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + (al < 1 ? al.toFixed(3) : 1) + ")";
        ctx.beginPath();
        ctx.arc(C + x1 * R * d, CY + y1 * R * d, Math.max(0.3, p.s * d), 0, 6.2832);
        ctx.fill();
      }
    }
    ctx.globalCompositeOperation = "source-over";
    this._raf = requestAnimationFrame(() => this.frame());
  }

  data() {
    return [
      { id: "apps", n: "01", name: "Applications", short: "Platforms, products, internal tools", b1: 5, b2: 13, b3: 8,
        title: "The product your operation actually runs on.",
        body: "Web platforms, mobile products and internal tools shaped around how the work really moves — built to be opened every morning by the people who do the job.",
        items: [{ t: "Product design and front-end" }, { t: "Application and API engineering" }, { t: "Internal tools and reporting" }, { t: "Deployment and handover" }] },
      { id: "agents", n: "02", name: "Agent Systems", short: "AI operators that act across the business", b1: 13, b2: 6, b3: 10,
        title: "Operators that do the work, with a human on the brake.",
        body: "AI that acts inside your business rather than chatting beside it. Every consequential step keeps an explicit approval point.",
        items: [{ t: "Triage, scoring and routing" }, { t: "Drafting and review agent pairs" }, { t: "Tool use against real systems" }, { t: "Approval queues and audit trails" }] },
      { id: "media", n: "03", name: "Media Engine", short: "Creative production with AI at the core", b1: 8, b2: 11, b3: 13,
        title: "Creative output as a production line.",
        body: "Generation, review and publishing wired into one pipeline, with brand rules living in the system rather than a shared folder.",
        items: [{ t: "Generative image and video pipelines" }, { t: "Brand and template systems" }, { t: "Review and versioning" }, { t: "Scheduling and distribution" }] },
      { id: "square", n: "04", name: "Town Square", short: "Marketplace and local-commerce infrastructure", b1: 11, b2: 13, b3: 5,
        title: "The infrastructure under local commerce.",
        body: "Marketplaces, storefronts and the machinery beneath them — built for merchants on a bad-signal phone on a busy Saturday.",
        items: [{ t: "Multi-merchant platforms" }, { t: "Payments and reconciliation" }, { t: "Catalogue and fulfilment" }, { t: "Merchant onboarding tools" }] },
      { id: "networks", n: "05", name: "Networks", short: "Secure infrastructure for serious operations", b1: 6, b2: 9, b3: 13,
        title: "Connectivity that does not need a hero.",
        body: "Network design for sites where downtime has a cost. Monitored continuously, documented properly, recoverable by someone other than us.",
        items: [{ t: "Site survey and network design" }, { t: "Segmentation, access and policy" }, { t: "Monitoring and response" }, { t: "Documentation and handover" }] },
      { id: "academy", n: "06", name: "Academy", short: "Practical AI capability for teams", b1: 13, b2: 8, b3: 11,
        title: "Capability that stays after we leave.",
        body: "Practical training for the people who will run what we build — the specific tools and judgement needed to keep it improving without us.",
        items: [{ t: "Role-specific working sessions" }, { t: "Digital literacy foundations" }, { t: "Internal enablement docs" }, { t: "Ongoing office hours" }] }
    ];
  }

  renderVals() {
    const ac = this.props.accent ?? "#c7a35a";
    const lv = this.props.live ?? "#34d399";
    const mods = this.data();
    const open = (id) => () => this.setState({ open: id });
    const close = () => this.setState({ open: null });

    const nodes = mods.map((m, i) => {
      const xy = this.nodeXY(i);
      return {
        name: m.name, b1: m.b1, b2: m.b2, b3: m.b3,
        left: (((195 + xy[0]) / 390) * 100).toFixed(2) + "%",
        top: (((125 + xy[1]) / 250) * 100).toFixed(2) + "%",
        open: open(m.id)
      };
    });

    const id = this.state.open;
    let dlg = null;
    if (id === "contact") {
      dlg = { kicker: "ENGAGEMENT", title: "Bring us the hard part.",
        body: "Tell us what keeps breaking. The first session is a working one: forty minutes on your actual process, ending with an honest read on whether this is worth building.",
        aLabel: "Bring along",
        items: [{ t: "The process that keeps failing" }, { t: "Who touches it, and where it stalls" }, { t: "What it costs you when it does" }, { t: "Anything already built that must survive" }],
        cta: "hello@bespokelabs.dev" };
    } else if (id) {
      const m = mods.find((x) => x.id === id);
      if (m) dlg = { kicker: m.n + " / " + m.name.toUpperCase(), title: m.title, body: m.body, aLabel: "What it covers", items: m.items, cta: "Start a build" };
    }

    return {
      accent: ac, live: lv, brand: this.props.brand ?? "#00B87E",
      motionAttr: (this.props.motion ?? true) ? "on" : "off",
      modules: mods.map((m) => Object.assign({}, m, { open: open(m.id) })),
      nodes: nodes,
      openContact: open("contact"),
      close: close,
      dialogOpen: !!dlg,
      dlg: dlg || { kicker: "", title: "", body: "", aLabel: "", items: [], cta: "" }
    };
  }
}
</script>
</body>
</html>
