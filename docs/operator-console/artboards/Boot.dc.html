<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; background: #050b09; }
    .bt * { box-sizing: border-box; }
    .bt { position: relative; width: 1440px; height: 900px; overflow: hidden; background: #050b09; color: #f3f0e7;
          font-family: "Plus Jakarta Sans", "Helvetica Neue", sans-serif; }
    .bt a { color: #c7a35a; text-decoration: none; }
    .bt a:hover { color: #f3f0e7; }
    .lab { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: #6a7a72; }
    .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }
    .disp { font-family: "Plus Jakarta Sans", "Helvetica Neue", sans-serif; font-weight: 600; letter-spacing: -.03em; }
    .mk { display: inline-grid; grid-template-columns: 6px 6px 6px; gap: 4px; align-items: end; height: 34px; }
    .mk i { display: block; background: var(--ac); transform-origin: bottom; animation: grow .7s cubic-bezier(.2,.8,.2,1) both; }
    .logo { font-family: "Plus Jakarta Sans", "Helvetica Neue", sans-serif; font-weight: 600; letter-spacing: -.03em; color: #f3f0e7; line-height: 1; white-space: nowrap; display: inline-block; }
    .logo b { color: var(--br); font-weight: 600; font-size: 1em; letter-spacing: .01em; }
    .logo i { font-style: normal; color: var(--br); font-weight: 600; font-size: .94em; padding: 0 .03em; }
    .logo-sub { font-family: "Plus Jakarta Sans", sans-serif; font-weight: 300; letter-spacing: .6em; margin-right: -.6em; text-transform: lowercase; color: #7f8f86; }


    .bg { position: absolute; inset: 0;
          background: radial-gradient(90% 70% at 50% 50%, rgba(199,163,90,.08), transparent 62%), linear-gradient(#0a1512, #050b09 62%); }
    .bg:after { content: ""; position: absolute; inset: 0; opacity: .45;
      background-image: linear-gradient(rgba(199,163,90,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(199,163,90,.055) 1px, transparent 1px);
      background-size: 64px 64px; mask-image: radial-gradient(80% 65% at 50% 50%, black, transparent 78%);
      animation: gridin 1.6s ease-out both; }

    /* ghosted HQ panels assembling at the perimeter */
    .ghost { position: absolute; border: 1px solid rgba(199,163,90,.18); background: rgba(243,240,231,.014); animation: ghostin .9s cubic-bezier(.2,.8,.2,1) both; }
    .ghost:before { content: ""; position: absolute; left: -1px; top: -1px; width: 9px; height: 9px; border-left: 1px solid var(--ac); border-top: 1px solid var(--ac); opacity: .6; }
    .ghost span { position: absolute; left: 12px; top: 11px; }

    .core { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 660px; text-align: center; }
    .ring { position: absolute; left: 50%; top: 50%; border: 1px solid rgba(199,163,90,.22); border-radius: 50%; transform: translate(-50%,-50%);
            animation: ringin 1.5s cubic-bezier(.2,.8,.2,1) both; }
    .ring.b { border-color: rgba(52,211,153,.14); border-style: dashed; }

    .line { display: grid; grid-template-columns: 12px 176px 1fr 62px; gap: 12px; align-items: baseline; padding: 5px 0;
            font-family: "JetBrains Mono", monospace; font-size: 10.5px; letter-spacing: .06em; color: #7f8f86;
            animation: linein .5s ease-out both; }
    .line b { color: #c9d5cb; font-weight: 400; }
    .line u { text-decoration: none; color: #2b3a33; overflow: hidden; white-space: nowrap; }
    .line s { text-decoration: none; text-align: right; color: var(--lv); }

    @keyframes grow { from { transform: scaleY(0); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }
    @keyframes gridin { from { opacity: 0; transform: scale(1.06); } to { opacity: .45; transform: scale(1); } }
    @keyframes ghostin { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes ringin { from { opacity: 0; transform: translate(-50%,-50%) scale(.72); } to { opacity: 1; transform: translate(-50%,-50%) scale(1); } }
    @keyframes linein { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
    @keyframes cursor { 50% { opacity: 0; } }
    .cur { display: inline-block; width: 7px; height: 13px; background: var(--lv); vertical-align: -2px; animation: cursor 1.1s steps(1) infinite; }
    .bt[data-motion="off"] * { animation: none !important; }
  </style>
</helmet>

<div class="bt" style="--ac: {{accent}}; --lv: {{live}}; --br: {{brand}};" data-motion="{{motionAttr}}">
  <div class="bg"></div>

  <div class="ghost" style="left: 22px; width: 280px; top: 64px; height: 261px; animation-delay: 1.55s;"><span class="lab">Applications</span></div>
  <div class="ghost" style="left: 22px; width: 280px; top: 341px; height: 261px; animation-delay: 1.64s;"><span class="lab">Agent Systems</span></div>
  <div class="ghost" style="left: 22px; width: 280px; top: 617px; height: 261px; animation-delay: 1.73s;"><span class="lab">Media Engine</span></div>
  <div class="ghost" style="right: 22px; width: 290px; top: 64px; height: 261px; animation-delay: 1.82s;"><span class="lab">Town Square</span></div>
  <div class="ghost" style="right: 22px; width: 290px; top: 341px; height: 261px; animation-delay: 1.91s;"><span class="lab">Networks</span></div>
  <div class="ghost" style="right: 22px; width: 290px; top: 617px; height: 261px; animation-delay: 2.00s;"><span class="lab">Academy</span></div>

  <div class="ring" style="width: 520px; height: 520px; animation-delay: .55s;"></div>
  <div class="ring b" style="width: 660px; height: 660px; animation-delay: .78s;"></div>
  <div class="ring" style="width: 380px; height: 380px; border-color: rgba(243,240,231,.08); animation-delay: .36s;"></div>

  <div class="core">
    <h1 class="logo" style="margin: 0; font-size: 64px; animation: linein .7s ease-out .35s both;"><b>&lt;</b>Bespoke<i>/</i><b>&gt;</b></h1>
    <div class="logo-sub" style="font-size: 14px; margin-top: 13px; animation: linein .7s ease-out .5s both;">applications labs</div>
    <p class="lab" style="margin: 20px 0 0; letter-spacing: .28em; animation: linein .7s ease-out .65s both;">Operator console — initialising</p>

    <div style="margin: 40px auto 0; width: 520px; text-align: left; border-top: 1px solid rgba(199,163,90,.16); padding-top: 16px;">
      <sc-for list="{{lines}}" as="l" hint-placeholder-count="6">
        <div class="line" style="animation-delay: {{l.delay}};">
          <span style="color: {{accent}};">&gt;</span>
          <b>{{l.task}}</b>
          <u>{{l.dots}}</u>
          <s>{{l.state}}</s>
        </div>
      </sc-for>
      <div class="line" style="grid-template-columns: 12px 1fr; animation-delay: 2.05s; color: {{live}};">
        <span>&gt;</span>
        <span>console live<span class="cur"></span></span>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 22px; bottom: 22px; right: 22px; display: flex; justify-content: space-between; animation: linein .6s ease-out 2.2s both;">
    <span class="lab">Nothing scrolls · everything opens in place</span>
    <span class="lab">hello@bespokelabs.dev</span>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#c7a35a","options":["#c7a35a","#f97316","#34d399","#a78bfa"],"section":"Palette"},"live":{"editor":"color","default":"#34d399","options":["#34d399","#4ecdc4","#f59e0b"],"section":"Palette"},"brand":{"editor":"color","default":"#00B87E","options":["#00B87E","#008F64","#34d399"],"section":"Palette"},"motion":{"editor":"boolean","default":true,"section":"Palette"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      ["mounting operator console", "OK"],
      ["capability index", "06"],
      ["method", "03"],
      ["operating rhythm", "04"],
      ["engagement channel", "OPEN"],
      ["motion field", "OK"]
    ];
    return {
      accent: this.props.accent ?? "#c7a35a",
      live: this.props.live ?? "#34d399",
      brand: this.props.brand ?? "#00B87E",
      motionAttr: (this.props.motion ?? true) ? "on" : "off",
      lines: raw.map((r, i) => ({
        task: r[0],
        state: r[1],
        dots: new Array(46).join("."),
        delay: (0.85 + i * 0.16).toFixed(2) + "s"
      }))
    };
  }
}
</script>
</body>
</html>
